<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Recycle Loop + Microchip / Leaf -->
  <g transform="translate(10, 6)">
    <!-- Circuit leaf -->
    <path d="M 24 4 C 12 12, 4 28, 12 40 C 24 48, 40 40, 44 24 C 44 14, 34 4, 24 4 Z" fill="url(#logoGrad)"/>
    <!-- Circuit lines inside leaf -->
    <path d="M 24 10 L 24 38 M 24 18 L 16 26 M 24 28 L 32 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="16" cy="26" r="3" fill="#34d399"/>
    <circle cx="32" cy="34" r="3" fill="#34d399"/>
    <circle cx="24" cy="38" r="3.5" fill="#ffffff"/>
  </g>
  
  <!-- Typography -->
  <text x="65" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0f172a" letter-spacing="-0.5">
    Eco<tspan fill="#10b981">Cycle</tspan>
  </text>
  <text x="66" y="46" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#64748b" letter-spacing="1.5">
    SMART E-WASTE PLATFORM
  </text>
</svg>