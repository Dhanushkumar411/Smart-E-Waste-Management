<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="360" height="260" fill="#f1f5f9" rx="12" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Outer Battery Pack Casing -->
  <rect x="70" y="80" width="260" height="150" rx="16" fill="url(#batGrad)" stroke="#475569" stroke-width="3"/>
  <rect x="330" y="130" width="16" height="50" rx="6" fill="#94a3b8"/>
  
  <!-- Internal Lithium Cells Exposed -->
  <g transform="translate(90, 105)">
    <!-- 18650 cell 1 -->
    <rect x="0" y="0" width="45" height="100" rx="8" fill="url(#cellGrad)"/>
    <rect x="12" y="-6" width="20" height="6" rx="2" fill="#e2e8f0"/>
    <text x="22" y="55" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle" transform="rotate(-90 22 55)">3.7V Li-ion</text>
    
    <!-- cell 2 -->
    <rect x="55" y="0" width="45" height="100" rx="8" fill="url(#cellGrad)"/>
    <rect x="67" y="-6" width="20" height="6" rx="2" fill="#e2e8f0"/>
    <text x="77" y="55" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle" transform="rotate(-90 77 55)">2600 mAh</text>
    
    <!-- cell 3 -->
    <rect x="110" y="0" width="45" height="100" rx="8" fill="url(#cellGrad)"/>
    <rect x="122" y="-6" width="20" height="6" rx="2" fill="#e2e8f0"/>
    <text x="132" y="55" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle" transform="rotate(-90 132 55)">18650 Cell</text>
    
    <!-- Protection circuit board -->
    <rect x="165" y="10" width="45" height="80" rx="4" fill="#047857"/>
    <circle cx="178" cy="25" r="4" fill="#fbbf24"/>
    <circle cx="178" cy="45" r="4" fill="#fbbf24"/>
    <rect x="190" y="20" width="14" height="20" fill="#1e293b" rx="2"/>
  </g>
  
  <!-- Danger Hazard Icon -->
  <g transform="translate(85, 45)">
    <polygon points="15,0 30,26 0,26" fill="url(#dangerGrad)"/>
    <text x="15" y="22" fill="#ffffff" font-weight="bold" font-size="16" font-family="sans-serif" text-anchor="middle">!</text>
    <text x="40" y="20" fill="#dc2626" font-weight="bold" font-size="13" font-family="sans-serif">CAUTION: LITHIUM HAZARD</text>
  </g>
</svg>