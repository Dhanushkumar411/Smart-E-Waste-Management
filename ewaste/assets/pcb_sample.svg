<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="360" height="260" fill="#f1f5f9" rx="12" stroke="#cbd5e1" stroke-width="2"/>

  <!-- PCB Board -->
  <rect x="60" y="50" width="280" height="200" rx="8" fill="url(#pcbGrad)" stroke="#022c22" stroke-width="3"/>
  
  <!-- CPU Socket -->
  <rect x="90" y="80" width="80" height="80" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="105" y="95" width="50" height="50" rx="2" fill="#1e293b"/>
  <text x="130" y="125" fill="#f59e0b" font-size="10" font-family="monospace" text-anchor="middle">CPU CORE</text>
  
  <!-- RAM Slots -->
  <rect x="190" y="70" width="12" height="110" fill="#1e293b" rx="2"/>
  <rect x="210" y="70" width="12" height="110" fill="#1e293b" rx="2"/>
  
  <!-- Gold Traces & Capacitors -->
  <path d="M 170 120 L 190 120 M 170 140 L 190 140 M 130 160 L 130 200 L 250 200" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <path d="M 100 160 L 100 220 L 70 220" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
  
  <!-- Capacitors -->
  <circle cx="250" cy="90" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="280" cy="90" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="250" cy="130" r="9" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <circle cx="280" cy="130" r="9" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  
  <!-- Gold Edge Fingers (high-value gold recovery) -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="10" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="20" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="30" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="40" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="50" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="60" y="0" width="6" height="10" fill="#f59e0b"/>
    <rect x="70" y="0" width="6" height="10" fill="#f59e0b"/>
  </g>
  <text x="140" y="235" fill="#fef08a" font-size="9" font-family="monospace">GOLD PLATED CONTACTS</text>
</svg>