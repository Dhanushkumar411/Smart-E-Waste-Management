<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="360" height="260" fill="#f1f5f9" rx="12" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Phone Body -->
  <rect x="140" y="40" width="120" height="220" rx="20" fill="url(#phoneGrad)" stroke="#475569" stroke-width="3"/>
  <!-- Screen -->
  <rect x="150" y="55" width="100" height="190" rx="10" fill="url(#screenGrad)"/>
  
  <!-- Notch/Speaker & Camera -->
  <rect x="180" y="46" width="40" height="4" rx="2" fill="#64748b"/>
  <circle cx="170" cy="48" r="2.5" fill="#64748b"/>
  
  <!-- Screen Shatter / Crack Lines -->
  <path d="M 160 70 L 210 130 L 180 180 L 235 230 M 210 130 L 240 110 M 180 180 L 160 210 M 210 130 L 195 90" 
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" fill="none"/>
        
  <!-- E-Waste Tag -->
  <rect x="40" y="50" width="85" height="30" rx="6" fill="#10b981"/>
  <text x="82" y="70" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">RECYCLABLE</text>
  
  <text x="280" y="80" fill="#64748b" font-size="12" font-family="sans-serif">AMOLED Panel</text>
  <text x="280" y="100" fill="#ef4444" font-size="11" font-family="sans-serif font-weight:bold">• Shattered Glass</text>
  <text x="280" y="120" fill="#10b981" font-size="11" font-family="sans-serif">• Gold & Tantalum</text>
  <text x="280" y="140" fill="#0284c7" font-size="11" font-family="sans-serif">• Rare Earths</text>
</svg>