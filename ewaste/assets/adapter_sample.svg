<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="adaptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="360" height="260" fill="#f1f5f9" rx="12" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Adapter Brick -->
  <rect x="70" y="90" width="130" height="90" rx="10" fill="url(#adaptGrad)" stroke="#0f172a" stroke-width="2"/>
  <rect x="185" y="115" width="20" height="40" rx="4" fill="#334155"/>
  <text x="135" y="130" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">AC/DC ADAPTER</text>
  <text x="135" y="145" fill="#64748b" font-size="8" font-family="monospace" text-anchor="middle">OUTPUT: 19.5V 3.34A</text>
  
  <!-- LED Power Light -->
